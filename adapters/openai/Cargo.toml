[package]
name = "pai_openai_adapter"
description = "OpenAI-compatible API adapter for PAI-Kernel · pre-request gate evaluation + post-response witness chain entry · reference middleware"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

pai_governance_daemon = { path = "../../runtime/governance_daemon", version = "1.3.2", features = ["testing"] }
pai_witness = { path = "../../crates/pai_witness", version = "1.3.2" }
