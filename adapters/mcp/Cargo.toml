[package]
name = "pai_mcp"
description = "MCP (Model Context Protocol) adapter for PAI-Kernel · exposes governance daemon API as MCP tools · reference integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

pai_governance_daemon = { path = "../../runtime/governance_daemon", version = "1.3.0", features = ["testing"] }
pai_witness = { path = "../../crates/pai_witness", version = "1.3.0" }
pai_storage = { path = "../../crates/pai_storage", version = "1.3.0" }
