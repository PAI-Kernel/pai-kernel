name: Bug report
description: Report a defect that could affect invariants or governance boundaries.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: breach_class
    attributes:
      label: Breach classification (if applicable)
      options:
        - OBJ.INJECTION
        - GOV.BYPASS
        - LOG.TAMPER
        - DRIFT.OVERTHRESHOLD
        - CONS.MODE.VIOLATION
        - UNKNOWN
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: false
