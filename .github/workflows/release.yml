# Release workflow — builds cross-platform binaries and attaches them to
# the GitHub Release on tag push.
#
# Triggers on any tag matching v* (e.g. v2.2.1). Builds pai_governance_daemon
# for 5 target triples:
#   - aarch64-apple-darwin          (Apple Silicon Mac)
#   - x86_64-apple-darwin           (Intel Mac)
#   - x86_64-pc-windows-msvc        (Windows x64)
#   - x86_64-unknown-linux-gnu      (Linux x64, glibc)
#   - aarch64-unknown-linux-gnu     (Linux ARM64, glibc, cross-compiled)
#
# Each binary is packaged with pai-kernel.toml + policies/ + LICENSE + README
# and uploaded to the corresponding GitHub Release along with a SHA256 checksum.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual trigger for docker multi-arch :latest tag updates without creating
    # a new git tag/Release. Use when adopter-facing fix needs deployment between
    # formal release events (e.g. multi-platform image rebuild for Apple Silicon
    # without v2.2.x.y patch ceremony).

permissions:
  contents: read   # topLevel least-privilege · publish job overrides to write (Token-Permissions OpenSSF Scorecard hardening)

jobs:
  # Constitutional compliance gate · runs BEFORE per-target build matrix.
  # Failure here BLOCKS the entire release pipeline · prevents binaries from
  # being uploaded and crates.io from being touched if T1..T6 invariant
  # validation fails. Runtime invariant leg of the pre-publication audit
  # triumvirate (citations · terminology · runtime compliance).
  compliance-gate:
    name: Compliance binary (constitutional gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action pinned · toolchain bumped to 1.88.0 in v2.2.2
        with:
          toolchain: 1.88.0

      - name: Run compliance binary (locked)
        run: cargo run -p pai_compliance --locked --release

  build:
    name: Build ${{ matrix.target }}
    needs: compliance-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write       # required for keyless Sigstore signing (cosign sign-blob OIDC flow)
      attestations: write   # required for actions/attest-build-provenance · SLSA build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            archive_tool: tar
          - target: x86_64-apple-darwin
            runner: macos-latest  # Apple Silicon — cross-compiles to Intel via target
            archive_ext: tar.gz
            archive_tool: tar
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            archive_tool: zip
            binary_suffix: .exe
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            archive_tool: tar
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            archive_tool: tar
            cross: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0 + target
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action pinned · toolchain bumped to 1.88.0 in v2.2.2 (time CVE MSRV requirement)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64-linux)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Build pai_governance_daemon
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p pai_kernel
          else
            cargo build --release --locked --target ${{ matrix.target }} -p pai_kernel
          fi

      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive_ext }}
          BIN_SUFFIX: ${{ matrix.binary_suffix }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="pai_governance_daemon-${TAG}-${TARGET}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          # Binary
          cp "target/${TARGET}/release/pai_governance_daemon${BIN_SUFFIX}" "${STAGE}/"
          # SDK runtime config + policies
          cp pai-kernel.toml "${STAGE}/"
          cp -r policies "${STAGE}/policies"
          # Framework corpus (3 canonical v2.2 documents)
          cp corpus/PAI_Constitutional_Document.md "${STAGE}/"
          cp corpus/PAI_Bill_of_Authorial_Rights.md "${STAGE}/"
          cp corpus/Glossary.md "${STAGE}/"
          # Release governance + adopter docs
          cp LICENSE "${STAGE}/"
          cp README.md "${STAGE}/"
          cp docs/INSTALL.md "${STAGE}/"
          cp docs/KNOWN_LIMITATIONS.md "${STAGE}/"
          cp docs/RELEASE_NOTES_v2.2.1.md "${STAGE}/"
          cp SECURITY.md "${STAGE}/"
          cp CITATION.cff "${STAGE}/"
          cd dist
          if [ "${EXT}" = "zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              7z a "${NAME}.zip" "${NAME}" > /dev/null
            else
              powershell -Command "Compress-Archive -Path '${NAME}' -DestinationPath '${NAME}.zip'"
            fi
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
          fi
          # SHA256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}.${EXT}" > "${NAME}.${EXT}.sha256"
          else
            shasum -a 256 "${NAME}.${EXT}" > "${NAME}.${EXT}.sha256"
          fi
          ls -la

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign binary archive (keyless Sigstore · OIDC)
        # Produce detached signature (.sig) + signing certificate (.cert) for
        # each binary archive · adopters verify via:
        #   cosign verify-blob --certificate <name>.cert --signature <name>.sig <name>
        # OpenSSF Scorecard Signed-Releases hardening · PF-057.
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive_ext }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          NAME="pai_governance_daemon-${TAG}-${TARGET}.${EXT}"
          cosign sign-blob --yes \
            --output-signature "${NAME}.sig" \
            --output-certificate "${NAME}.cert" \
            "${NAME}"
          ls -la "${NAME}".sig "${NAME}".cert

      - name: Generate SLSA build provenance attestation
        # Produces .intoto.jsonl in-toto attestation bundle covering binary
        # archive · provides SLSA Level 3 provenance via GitHub OIDC + Sigstore.
        # Adopters verify via:
        #   gh attestation verify <name> --owner PAI-Kernel
        # OpenSSF Scorecard Signed-Releases hardening · adds provenance
        # component (2/10 of check) on top of Sigstore .sig (8/10).
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        id: attest
        with:
          subject-path: dist/pai_governance_daemon-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}

      - name: Co-locate attestation bundle in dist/
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive_ext }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="pai_governance_daemon-${TAG}-${TARGET}.${EXT}"
          cp "${BUNDLE}" "dist/${NAME}.intoto.jsonl"
          ls -la "dist/${NAME}.intoto.jsonl"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive_ext }}
            dist/*.sha256
            dist/*.sig
            dist/*.cert
            dist/*.intoto.jsonl

  corpus-bundle:
    name: Build corpus-only bundle (framework docs without SDK)
    needs: compliance-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Package corpus-only bundle
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="PAI-CD-corpus-${TAG}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          # 3 canonical corpus documents (the normative framework itself)
          cp corpus/PAI_Constitutional_Document.md "${STAGE}/"
          cp corpus/PAI_Bill_of_Authorial_Rights.md "${STAGE}/"
          cp corpus/Glossary.md "${STAGE}/"
          # Release governance
          cp LICENSE "${STAGE}/"
          cp README.md "${STAGE}/"
          cp CITATION.cff "${STAGE}/"
          cp docs/RELEASE_NOTES_v2.2.1.md "${STAGE}/" 2>/dev/null || true
          # Papers (if present — published SSRN paper PDFs)
          if [ -d papers ]; then
            mkdir -p "${STAGE}/papers"
            cp papers/*.pdf "${STAGE}/papers/" 2>/dev/null || true
          fi
          cd dist
          tar czf "${NAME}.tar.gz" "${NAME}"
          zip -qr "${NAME}.zip" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          ls -la

      - name: Upload corpus bundle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-corpus-bundle
          path: |
            dist/PAI-CD-corpus-*.tar.gz
            dist/PAI-CD-corpus-*.zip
            dist/PAI-CD-corpus-*.sha256

  docker:
    name: Build + push Docker image
    needs: compliance-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless Sigstore signing (cosign OIDC flow)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign published Docker image (keyless Sigstore · OIDC)
        # Sign each pushed tag using cosign + GitHub OIDC token (no key
        # material managed by repo · transparency log entry to Rekor).
        # OpenSSF Scorecard Signed-Releases hardening · PF-057.
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

  publish:
    name: Publish GitHub Release
    needs: [build, corpus-bundle]
    runs-on: ubuntu-latest
    # Only create GitHub Release on tag push (formal release event).
    # Skip during manual workflow_dispatch (which is for between-release
    # docker :latest multi-arch updates only · no Release artifact).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Create or update GitHub Release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Create release if it doesn't exist yet.
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            if [ -f docs/RELEASE_NOTES_v2.2.1.md ] && [[ "${TAG}" == v2.2.1* ]]; then
              gh release create "${TAG}" \
                --title "PAI-Kernel ${TAG}" \
                --notes-file docs/RELEASE_NOTES_v2.2.1.md \
                --prerelease
            else
              gh release create "${TAG}" \
                --title "PAI-Kernel ${TAG}" \
                --generate-notes \
                --prerelease
            fi
          fi

          # Upload/update all dist/ artifacts.
          gh release upload "${TAG}" dist/* --clobber
