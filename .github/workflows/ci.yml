# Public-repo CI for PAI-Kernel/pai-kernel (copied to .github/workflows/ci.yml on publish).
#
# Two parallel jobs:
#   1. Lint & verify — markdownlint, CITATION.cff, internal links
#   2. Build & test — cargo build + cargo test on full workspace (with cargo cache)
#
# Both jobs must pass for green CI. Runs on every push/PR to main.
# Does NOT include TLC / coverage / GPG verify — those live in internal-only CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 '**/*.md' '#node_modules'

      - name: Validate CITATION.cff
        run: |
          pip install --quiet cffconvert
          cffconvert --validate

      - name: Check internal links
        run: |
          python3 -c "
          import pathlib, re, sys
          errors = []
          for md in pathlib.Path('.').rglob('*.md'):
              text = md.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'\[([^\]]+)\]\((?!https?://|mailto:)([^)#]+)', text):
                  target = md.parent / m.group(2)
                  if not target.exists():
                      errors.append(f'  {md}: broken link -> {m.group(2)}')
          if errors:
              print('Broken internal links found:')
              print('\n'.join(errors))
              sys.exit(1)
          print('All internal links OK')
          "

  build-test:
    name: Build & test (Rust workspace)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.86.0 (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.86.0
        with:
          toolchain: 1.86.0

      - name: Cache cargo registry + git + target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release, workspace, locked)
        run: cargo build --workspace --release --locked

      - name: Test (release, workspace, locked)
        run: cargo test --workspace --release --locked
