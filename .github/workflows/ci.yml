# Public-repo CI for PAI-Kernel/pai-kernel.
#
# Two parallel jobs:
#   1. Lint & verify — markdownlint, CITATION.cff (hash-pinned), internal links
#   2. Build & test — cargo build + cargo test on full workspace (cargo cache)
#
# Both jobs must pass for green CI. Runs on every push/PR to main.
# Does NOT include TLC / coverage / GPG verify — those live in internal-only CI.
#
# Runner: GitHub-hosted ubuntu-latest (public repo · reproducibility · adopter trust ·
# self-host runner architecture NOT applied к public per CI-B2 discipline · only
# pai-kernel-internal + pai-kernel-pre-public use self-host).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Markdown lint
        # markdownlint-cli2 v0.18.x · pinned via @ to prevent silent upgrade;
        # acceptable lightweight tool · readonly linter · not shipped в release artifacts.
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md' '#node_modules'

      - name: Validate CITATION.cff
        # cffconvert v2.0.0 + transitive deps · hash-pinned via pip-tools
        # (Pinned-Dependencies OpenSSF Scorecard hardening · PF-057).
        # Install в isolated venv: avoids PEP 668 «externally-managed-environment»
        # restriction (macOS Sonoma+) · uses explicit binary path к sidestep PATH
        # ambiguity · cleanly disposable per CI run. Requirements regenerated
        # via: pip-compile --generate-hashes --allow-unsafe (when bumping versions).
        run: |
          python3 -m venv /tmp/cff-venv
          /tmp/cff-venv/bin/pip install --quiet --require-hashes -r .github/workflows/citation-requirements.txt
          /tmp/cff-venv/bin/cffconvert --validate

      - name: Check internal links
        run: |
          python3 -c "
          import pathlib, re, sys
          errors = []
          for md in pathlib.Path('.').rglob('*.md'):
              text = md.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'\[([^\]]+)\]\((?!https?://|mailto:)([^)#]+)', text):
                  target = md.parent / m.group(2)
                  if not target.exists():
                      errors.append(f'  {md}: broken link -> {m.group(2)}')
          if errors:
              print('Broken internal links found:')
              print('\n'.join(errors))
              sys.exit(1)
          print('All internal links OK')
          "

  build-test:
    name: Build & test (Rust workspace)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0 (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action pinned · toolchain bumped к 1.88.0 in v2.2.2 (time CVE MSRV requirement)
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry + git + target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release, workspace, locked)
        run: cargo build --workspace --release --locked

      - name: Test (release, workspace, locked)
        run: cargo test --workspace --release --locked

      # Constitutional compliance gate · runs the binary harness (separate
      # from workspace tests · exercises T1..T6 invariant validation through
      # full daemon path). Failure of any compliance test BLOCKS CI ·
      # symmetric с reference audit и terminology check disciplines · this
      # is the runtime invariant verification leg of the pre-publication
      # audit triumvirate.
      - name: Compliance binary (constitutional gate)
        run: cargo run -p pai_compliance --locked --release
