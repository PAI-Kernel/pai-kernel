name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 3 * * 2"  # Weekly Tuesday 03:15 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # CodeQL is configured for the canonical public repo. Skip cleanly in
    # forks, mirrors, or private rehearsal environments where anonymous
    # clone is unavailable.
    if: github.repository == 'PAI-Kernel/pai-kernel'
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is the primary language of the SDK workspace (crates/,
        # runtime/, examples/, compliance/). build-mode: autobuild runs
        # the actual cargo build, giving CodeQL full type info + macro
        # expansion + cross-crate analysis (deeper security scan).
        include:
          - language: rust
            build-mode: autobuild
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.86.0 (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.86.0
        with:
          toolchain: 1.86.0

      - name: Cache cargo registry + git + target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-codeql-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-codeql-cargo-

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
