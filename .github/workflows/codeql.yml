name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 3 * * 2"  # Weekly Tuesday 03:15 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # CodeQL is configured for the canonical public repo. Skip cleanly in
    # forks, mirrors, or private rehearsal environments where anonymous
    # clone is unavailable.
    if: github.repository == 'PAI-Kernel/pai-kernel'
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is the primary language of the SDK workspace (crates/,
        # runtime/, examples/, compliance/). build-mode: none — CodeQL
        # Rust extractor performs source-level analysis without cargo build
        # (autobuild mode no longer supported by the Rust extractor as of
        # CodeQL 2.25.4 · 2026-05-10 failure log: «Rust does not support
        # the autobuild build mode. Please try using one of the following
        # build modes instead: none»).
        include:
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          category: "/language:${{ matrix.language }}"
