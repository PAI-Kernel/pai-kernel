name: Fuzz

# OpenSSF Scorecard Fuzzing check · PF-057 hardening.
# cargo-fuzz с libfuzzer · 10 targets covering adopter-input attack surfaces:
#   - pai_export · ExportBundle deserialize + verify integrity (bundle import)
#   - pai_witness · WitnessEntry deserialize (witness chain log import)
#   - pai_pii · scan_text (PII detection regex DoS surface · text input)
#   - pai_boundary · BoundaryDeclaration deserialize (MP-5 boundary config import)
#   - pai_compliance_id · CertificationEvidence + assess_certification (compliance tier)
#   - pai_provenance · ProvenanceMetadata deserialize (Doc 11 · supply-chain artifact)
#   - pai_classify · RecActionClassifier::classify (RAB-I1..RAB-I7 · structured fuzz)
#   - pai_attestation · TcbManifest deserialize (Doc 10 §P1 · attestation entry point)
#   - pai_delegation · DelegationStore op sequence (DEL-I1..DEL-I6 · structured fuzz)
#   - pai_drift · DriftReport deserialize (DFT-I1..DFT-I5 · monitoring artifact)
#
# Seed corpus: representative valid inputs в fuzz/corpus/<target>/ bootstrap
# libFuzzer coverage faster (committed seeds · libFuzzer mutates from these).
#
# Triggers:
#   - On push к main · 180s fuzz run per target · regression detection (public only)
#   - On PR к main · same 180s run (public only)
#   - Weekly scheduled · 1800s (30 min) per target · deeper exploration (public only)
#   - workflow_dispatch · manual trigger · works on all surfaces
#
# Cross-axis discipline: identical file на all 3 surfaces (pre-public · public ·
# internal). Job-level `if:` guard skips automatic execution на private repos
# (pai-kernel-pre-public · pai-kernel-internal) к избежать GitHub Actions Free
# quota exhaustion (2000 min/мес limit на private repos · ubuntu-latest billed).
# Public repo unlimited · always runs. Manual workflow_dispatch bypasses guard
# на any surface для on-demand fuzz validation. CI-B2 architecture precedent:
# ci.yml уже использует self-hosted runners на private; fuzz.yml deferred к
# workflow_dispatch-only pending self-host empirical validation для cargo-fuzz +
# libFuzzer на macOS arm64 self-host hardware.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # Weekly Monday 05:00 UTC
  workflow_dispatch:    # manual trigger · bypasses private-repo guard

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    # Skip automatic runs на private repos к conserve GitHub Actions Free
    # quota. workflow_dispatch overrides this guard на any surface.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'PAI-Kernel/pai-kernel'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - export_bundle_parse
          - witness_entry_parse
          - pii_scan_text
          - boundary_declaration_parse
          - compliance_assess
          - provenance_parse
          - classify
          - attestation_manifest
          - delegation_sequence
          - drift_report
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action hash-pinned
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache cargo-fuzz binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-v0.12

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install cargo-fuzz --locked --version "^0.12"
          fi

      - name: Run fuzz target ${{ matrix.target }}
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '1800' || '180' }}
        run: |
          cd fuzz
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${FUZZ_TIME}
