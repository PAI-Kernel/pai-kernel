[package]
name = "pai_kernel_fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
pai_export = { path = "../crates/pai_export" }
pai_witness = { path = "../crates/pai_witness" }
pai_pii = { path = "../crates/pai_pii" }
pai_boundary = { path = "../crates/pai_boundary" }
pai_compliance_id = { path = "../crates/pai_compliance_id" }
pai_provenance = { path = "../crates/pai_provenance" }
# Session #22 additions · 4 new public-API entry points
pai_classify = { path = "../crates/pai_classify" }
pai_attestation = { path = "../crates/pai_attestation" }
pai_delegation = { path = "../crates/pai_delegation" }
pai_drift = { path = "../crates/pai_drift" }

# Prevent this crate from being treated as a workspace member
# (cargo-fuzz convention · separate package · won't pollute parent workspace).
[workspace]

[[bin]]
name = "export_bundle_parse"
path = "fuzz_targets/export_bundle_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "witness_entry_parse"
path = "fuzz_targets/witness_entry_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pii_scan_text"
path = "fuzz_targets/pii_scan_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "boundary_declaration_parse"
path = "fuzz_targets/boundary_declaration_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compliance_assess"
path = "fuzz_targets/compliance_assess.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provenance_parse"
path = "fuzz_targets/provenance_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attestation_manifest"
path = "fuzz_targets/attestation_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delegation_sequence"
path = "fuzz_targets/delegation_sequence.rs"
