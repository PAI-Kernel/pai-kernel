[package]
name = "pai_compliance"
version = "1.3.0"
edition = "2021"

[dependencies]
time = { version = "0.3" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pai_governance_daemon = { path = "../../runtime/governance_daemon", features = ["testing"] }
pai_delegation = { path = "../../crates/pai_delegation" }
pai_witness = { path = "../../crates/pai_witness" }
pai_classify = { path = "../../crates/pai_classify" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "compliance_test_suite"
path = "src/lib.rs"

[[bin]]
name = "pai_compliance"
path = "src/main.rs"