[package]
name = "pai_governance_daemon"
description = "Constitutional governance daemon for PAI-Kernel · invariant enforcement substrate per PAI-CD v2.2 Freeze Edition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1"
pai_influence = { path = "../../crates/pai_influence", version = "1.3.2" }
pai_gate = { path = "../../crates/pai_gate", version = "1.3.2" }
pai_interface = { path = "../../crates/pai_interface", version = "1.3.2" }
rand_core = "0.6"
getrandom = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "1.0"
time = { version = "0.3", features = ["serde", "formatting"] }
hex = "0.4"

[dev-dependencies]
proptest = "1"

[features]
# Enables test-only helper APIs (must not be enabled in production consumers).
testing = []
