[package]
name = "pai_governance_daemon"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
regex = "1"
pai_influence = { path = "../../crates/pai_influence" }
pai_gate = { path = "../../crates/pai_gate" }
pai_interface = { path = "../../crates/pai_interface" }
rand_core = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
time = { version = "0.3", features = ["serde", "formatting"] }
hex = "0.4"

[dev-dependencies]
proptest = "1"

[features]
# Enables test-only helper APIs (must not be enabled in production consumers).
testing = []
