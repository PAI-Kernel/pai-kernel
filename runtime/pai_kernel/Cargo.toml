[package]
name = "pai_kernel"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pai_governance_daemon"
path = "src/main.rs"

[dependencies]
# Workspace crates
pai_governance_daemon = { path = "../governance_daemon", features = ["testing"] }
pai_api = { path = "../../crates/pai_api" }
pai_storage = { path = "../../crates/pai_storage" }
pai_policy = { path = "../../crates/pai_policy" }
pai_drift = { path = "../../crates/pai_drift" }
pai_export = { path = "../../crates/pai_export" }
pai_config = { path = "../../crates/pai_config" }
pai_witness = { path = "../../crates/pai_witness" }

# Runtime
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
