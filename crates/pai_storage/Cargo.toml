[package]
name = "pai_storage"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
pai_governance_daemon = { path = "../../runtime/governance_daemon", features = ["testing"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
