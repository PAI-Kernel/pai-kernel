[package]
name = "pai_storage"
description = "Durable append-only storage for PAI-Kernel governance state · GovernanceStore trait with SQLite backend per PAI-CD v2.2 Identity Layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pai_governance_daemon = { path = "../../runtime/governance_daemon", version = "1.3.0", features = ["testing"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
