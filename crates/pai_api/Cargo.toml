[package]
name = "pai_api"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

pai_governance_daemon = { path = "../../runtime/governance_daemon", features = ["testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pai_witness = { path = "../pai_witness" }
pai_policy = { path = "../pai_policy" }
pai_drift = { path = "../pai_drift" }
pai_storage = { path = "../pai_storage" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
pai_export = { path = "../pai_export" }
pai_config = { path = "../pai_config" }
pai_storage = { path = "../pai_storage" }
