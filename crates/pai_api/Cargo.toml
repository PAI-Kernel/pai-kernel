[package]
name = "pai_api"
description = "HTTP governance API for PAI-Kernel · axum-based · auto-appends mutation endpoints to witness chain per PAI-CD v2.2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

pai_governance_daemon = { path = "../../runtime/governance_daemon", version = "1.3.1", features = ["testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pai_witness = { path = "../pai_witness", version = "1.3.1" }
pai_policy = { path = "../pai_policy", version = "1.3.1" }
pai_drift = { path = "../pai_drift", version = "1.3.1" }
pai_storage = { path = "../pai_storage", version = "1.3.1" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
pai_export = { path = "../pai_export", version = "1.3.1" }
pai_config = { path = "../pai_config", version = "1.3.1" }
pai_storage = { path = "../pai_storage", version = "1.3.1" }
