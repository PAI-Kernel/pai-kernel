[package]
name = "pai_harness"
description = "Integration test harness for PAI-Kernel governance daemon · reference scaffold (no real inference or UI) for PAI-CD v2.2 conformance checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
pai_gate = { path = "../pai_gate", version = "1.3.0" }
pai_interface = { path = "../pai_interface", version = "1.3.0" }
pai_influence = { path = "../pai_influence", version = "1.3.0" }
pai_governance_daemon = { path = "../../runtime/governance_daemon", version = "1.3.0", features = ["testing"] }
