[package]
name = "pai_export"
description = "Author state export service for PAI-Kernel · full state portability available regardless of Conservative Mode per PAI-CD v2.2 Authorial Sovereignty"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pai_governance_daemon = { path = "../../runtime/governance_daemon", version = "1.3.2", features = ["testing"] }
pai_witness = { path = "../pai_witness", version = "1.3.2" }
pai_drift = { path = "../pai_drift", version = "1.3.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }

# WASM target support · enables `js` feature on getrandom 0.2 for wasm32-unknown-unknown.
# Required because transitive deps (via ed25519-dalek/pai_governance_daemon) pull getrandom 0.2,
# which needs explicit WASM feature flag for browser/JS runtime support.
# Per WASM_VALIDATION_2026-05-08.md § 2.2 mitigation · target-specific scope (NOT enabled on native).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
