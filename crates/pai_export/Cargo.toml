[package]
name = "pai_export"
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
pai_governance_daemon = { path = "../../runtime/governance_daemon", features = ["testing"] }
pai_witness = { path = "../pai_witness" }
pai_drift = { path = "../pai_drift" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
